name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            cmake_arch: ""
            name: "Linux AMD64"
            optional: false
          # Linux ARM64 (using QEMU)
          - os: ubuntu-latest
            arch: arm64
            cmake_arch: "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
            name: "Linux ARM64"
            optional: false

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up system for Linux ARM64
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # Install ARM64 cross-compilation tools
          sudo apt-get install -y crossbuild-essential-arm64

      - name: Install dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            rapidjson-dev \
            libgtest-dev \
            git

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            ${{ matrix.cmake_arch }} \
            -DAGENTFLOW_BUILD_TESTS=OFF \
            -DAGENTFLOW_WITH_PROTOACTOR=OFF \
            -DAGENTFLOW_WITH_OPENSSL=ON

      - name: Build
        working-directory: build
        run: |
          make -j$(nproc)

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-${{ matrix.name }}-${{ github.sha }}
          path: build/
          retention-days: 7

      - name: Print build info
        if: success()
        run: |
          echo "Build completed successfully for ${{ matrix.name }}"
          echo "C++ Standard: 17"
          echo "Build Type: Release"
          g++ --version
