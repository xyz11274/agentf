name: Credential Safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Reject hard-coded credentials
        run: python3 scripts/quality/scan_secrets.py --tracked
