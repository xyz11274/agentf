name: Manual Build & Test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
      enable_coverage:
        description: 'Enable code coverage analysis'
        required: false
        default: false
        type: boolean
      run_valgrind:
        description: 'Run Valgrind memory checks'
        required: false
        default: false
        type: boolean
      notify_slack:
        description: 'Send Slack notification on completion'
        required: false
        default: false
        type: boolean

jobs:
  manual-build:
    name: Manual Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux AMD64"
          - os: macos-12
            name: "macOS AMD64"
          - os: macos-14
            name: "macOS ARM64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libssl-dev libwebsockets-dev libprotobuf-dev protobuf-compiler \
            rapidjson-dev libevent-dev libgtest-dev git
          if [ "${{ github.event.inputs.run_valgrind }}" = "true" ]; then
            sudo apt-get install -y valgrind
          fi
          if [ "${{ github.event.inputs.enable_coverage }}" = "true" ]; then
            sudo apt-get install -y lcov gcovr
          fi

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake openssl@3 libwebsockets protobuf rapidjson libevent googletest ninja

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} -DCMAKE_CXX_STANDARD=17"
          if [ "${{ github.event.inputs.enable_coverage }}" = "true" ]; then
            CMAKE_FLAGS="$CMAKE_FLAGS -DCMAKE_CXX_FLAGS='--coverage' -DCMAKE_EXE_LINKER_FLAGS='--coverage'"
          fi
          cmake .. $CMAKE_FLAGS \
            -DAGENTFLOW_WITH_PROTOACTOR=OFF \
            -DAGENTFLOW_WITH_OPENSSL=ON \
            -DAGENTFLOW_WITH_PROTOBUF=ON \
            -DAGENTFLOW_WITH_LIBWEBSOCKETS=ON

      - name: Build
        working-directory: build
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -j$(nproc || sysctl -n hw.ncpu)

      - name: Run code coverage
        if: github.event.inputs.enable_coverage == 'true'
        working-directory: build
        run: |
          lcov --directory . --capture --output-file coverage.info --no-external
          lcov --remove coverage.info '/usr/*' '/opt/*' '*/test/*' '*/tests/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_html

      - name: Run Valgrind
        if: github.event.inputs.run_valgrind == 'true' && runner.os == 'Linux'
        working-directory: build
        run: |
          ctest -D ExperimentalMemCheck || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: manual-build-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build/
            README.md
          retention-days: 7

      - name: Slack notification
        if: github.event.inputs.notify_slack == 'true' && always()
        run: |
          echo "Build completed for ${{ matrix.name }}"
          echo "Build Type: ${{ github.event.inputs.build_type }}"
          echo "Coverage Enabled: ${{ github.event.inputs.enable_coverage }}"
          echo "Valgrind Enabled: ${{ github.event.inputs.run_valgrind }}"
