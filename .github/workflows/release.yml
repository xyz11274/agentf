name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.release_tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          # Extract changelog for this version
          if [ -f CHANGELOG.md ]; then
            echo "changelog_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          body: |
            # Release ${{ steps.changelog.outputs.version }}
            
            This is an automated release build for AgentFlow.
            
            ## Artifacts
            - Build artifacts are available in the Actions tab
            - See [CHANGELOG.md](CHANGELOG.md) for detailed changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            name: "Linux AMD64"
            artifact_suffix: linux-amd64
          # macOS x86_64
          - os: macos-12
            arch: x86_64
            name: "macOS AMD64"
            artifact_suffix: macos-amd64
          # macOS ARM64
          - os: macos-14
            arch: arm64
            name: "macOS ARM64"
            artifact_suffix: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libwebsockets-dev \
            libprotobuf-dev \
            protobuf-compiler \
            rapidjson-dev \
            libevent-dev \
            libgtest-dev

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake openssl@3 libwebsockets protobuf rapidjson libevent googletest ninja

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DAGENTFLOW_WITH_PROTOACTOR=OFF \
            -DAGENTFLOW_WITH_OPENSSL=ON \
            -DAGENTFLOW_WITH_PROTOBUF=ON \
            -DAGENTFLOW_WITH_LIBWEBSOCKETS=ON

      - name: Build
        working-directory: build
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -j$(nproc || sysctl -n hw.ncpu)

      - name: Create distribution package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_NAME="agentflow-${VERSION}-${{ matrix.artifact_suffix }}"
          DIST_DIR="$ARTIFACT_NAME"
          
          mkdir -p "$DIST_DIR"
          
          # Copy headers
          cp -r include "$DIST_DIR/"
          
          # Copy libraries
          mkdir -p "$DIST_DIR/lib"
          if [ -f build/libagentflow.a ]; then
            cp build/libagentflow.a "$DIST_DIR/lib/"
          fi
          if [ -f build/libagentflow.so ]; then
            cp build/libagentflow.so "$DIST_DIR/lib/"
          fi
          if [ -f build/libagentflow.dylib ]; then
            cp build/libagentflow.dylib "$DIST_DIR/lib/"
          fi
          
          # Copy CMake files
          mkdir -p "$DIST_DIR/cmake"
          cp cmake/*.cmake "$DIST_DIR/cmake/" || true
          
          # Copy documentation
          cp README.md LICENSE.md CHANGELOG.md docs/*.md "$DIST_DIR/" 2>/dev/null || true
          
          # Create tarball
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar -czf "$ARTIFACT_NAME.tar.gz" "$DIST_DIR"
          else
            tar -czf "$ARTIFACT_NAME.tar.gz" "$DIST_DIR"
          fi
          
          # Calculate checksum
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"
          else
            sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"
          fi
          
          echo "artifact_path=$ARTIFACT_NAME.tar.gz" >> "$GITHUB_ENV"
          echo "checksum_path=$ARTIFACT_NAME.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            ${{ env.artifact_path }}
            ${{ env.checksum_path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-release-${{ matrix.artifact_suffix }}-${{ steps.version.outputs.version }}
          path: |
            build/
            README.md
          retention-days: 90

  publish-artifacts:
    name: Publish Release Artifacts
    needs: build-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: List artifacts
        run: find . -type f -name "*.tar.gz*" | head -20

      - name: Create release summary
        run: |
          echo "# Release Summary" > RELEASE_SUMMARY.md
          echo "" >> RELEASE_SUMMARY.md
          echo "## Artifacts" >> RELEASE_SUMMARY.md
          find . -type f -name "*.tar.gz*" | sort | while read f; do
            if [[ "$f" == *.sha256 ]]; then
              echo "  - $(basename $f)" >> RELEASE_SUMMARY.md
            fi
          done
          cat RELEASE_SUMMARY.md

      - name: Output artifact list
        run: |
          echo "All release artifacts have been published."
          echo "Please find them in the GitHub Release page."
