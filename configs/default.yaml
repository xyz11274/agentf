# AgentFlow Default Configuration
#
# This file contains the default configuration values.
# User configurations can override these settings.

# Application info
app:
  name: "AgentFlow"
  version: "1.0.0"

# Feature flags
features:
  hot_reload: true
  distributed: false
  metrics: true
  tracing: false

# Resource limits
limits:
  max_workflows_per_agent: 100
  max_nodes_per_workflow: 1000
  max_edges_per_workflow: 2000
  max_input_params_per_node: 50
  max_output_params_per_node: 50

# Performance tuning
performance:
  # Node task queue size
  task_queue_size: 10000

  # Event queue size
  event_queue_size: 10000

  # Batch size for metrics export
  metrics_batch_size: 100

  # Cache size for compiled DSL
  dsl_cache_size: 1000
