# AgentFlow Logging Configuration

# Default logging level
default_level: INFO

# Logger configurations
loggers:
  # Root logger
  root:
    level: INFO
    sinks:
      - console

  # Core framework logger
  agentflow.core:
    level: DEBUG
    sinks:
      - console
      - file

  # Runtime logger
  agentflow.runtime:
    level: INFO
    sinks:
      - console

  # Actor system logger
  agentflow.actor:
    level: INFO
    sinks:
      - console

  # Network logger
  agentflow.network:
    level: WARNING
    sinks:
      - console

  # Storage logger
  agentflow.storage:
    level: INFO
    sinks:
      - console

  # DSL parser logger
  agentflow.dsl:
    level: INFO
    sinks:
      - console

# Sink definitions
sinks:
  # Console sink
  console:
    type: console
    format: "[{timestamp}] [{level}] [{logger}] {message}"
    colorize: true

  # File sink
  file:
    type: rotating_file
    path: "./logs/agentflow.log"
    max_size: 104857600  # 100MB
    max_files: 10
    format: "[{timestamp}] [{level}] [{logger}] [{thread}] {message}"
    colorize: false

# Pattern variables:
# {timestamp} - ISO 8601 timestamp
# {level} - Log level
# {logger} - Logger name
# {thread} - Thread ID
# {message} - Log message
# {file} - Source file
# {line} - Line number
# {function} - Function name
