# AgentFlow Bridge — 测试环境配置
#
# 适用于 E2E 测试和 CI 环境。
# 使用方式：AGENTFLOW_ENV=test ./scripts/start_bridge.sh
# 加载优先级: 系统环境变量 > .env 文件 > 此文件 > 代码默认值

# ── Daemon（agentflowd）连接 ──────────────────────────────────────
daemon:
  host: "127.0.0.1"
  port: 17891

# ── Bridge 服务绑定 ───────────────────────────────────────────────
bridge:
  listen: "0.0.0.0:8199"

# ── Sidecar（测试环境不启用） ─────────────────────────────────────
sidecar:
  enabled: false
  listen: "0.0.0.0:23767"
  aisf_adapter_url: "http://127.0.0.1:18080"

# ── AISF Adapter ───────────────────────────────────────────────────
aisf_adapter:
  agent_id: "outfit-assistant"
  mode: "async"
  timeout: 60.0  # 测试用较短超时
  upstream:
    scheme: "http"
    callback_port: 23767
    callback_path: "/coremind/systemagent/v1/callback"
    client_cert_path: ""
    client_key_path: ""
    client_key_password: ""
    ca_cert_path: ""
    verify: false  # 测试场景跳过证书校验

# ── Artifact 公网地址 ─────────────────────────────────────────────
artifact_public_base_url: "http://localhost:8199/health"

# ── 产物输出模式（两维正交开关，详见 docs/design/features/artifact-output-pipeline.md §3.6）──
artifact_reference: "placeholder"
artifact_payload: "base64"

# ── 产物存储目录（详见 docs/design/features/sandbox/artifact-storage.md §8）──
# 空字符串 = 默认 agent_packages_path.parent / artifacts_storage
artifacts_storage_dir: ""


# ── 图片压缩开关（读取/返回 base64 时压缩,不污染存储原图）──
# 默认启用:读取时等比压缩到最长边 512px + JPEG quality 80(详见 artifact-storage.md §2.4)。
# 置 false 时返回 raw base64 不压缩(对应 env AF_BR_ARTIFACT_COMPRESS_ENABLED)。
artifact_compress_enabled: true

# ── 文件路径 ──────────────────────────────────────────────────────
agent_packages_dir: "examples/agent"
skill_hub_dir: "resource/skill_hub"
agent_template_dir: "frontend/bridge/templates/agent_template"
# ── 日志与超时 ────────────────────────────────────────────────────
log_level: "DEBUG"
request_timeout_seconds: 30.0  # CI 环境保留一定余量
upload_max_body_size_mb: 100

# ── 会话持久化 ────────────────────────────────────────────────────
session_provider: "local"
session_db_path: "/tmp/agentflow/test-sessions.db"  # 测试用临时路径
session_context_limit_rounds: 5
session_sync_interval: 10.0  # 测试时缩短同步间隔

# ── 多模态内容 ────────────────────────────────────────────────────
uploads_dir: "/tmp/agentflow/test-uploads"
chat_turn_timeout_seconds: 300.0  # 实测 outfit-stylist skill 耗时分布（logs/tests/ 3 轮回归）：最坏 162s、多个 >100s 样本，是 LLM while-loop 多轮 tool_calls 的真实业务厚度（非偶发）；300s 留 ~1.8x 余量。客户端 read_timeout 必须略大于此值（见 frontend/bridge/tests/test_e2e_rest_chat_session.py）。真实 LLM 偶发慢还由 test_multi_turn_context_maintained 断言放宽兜底（3 轮中至少 2 轮成功），不只靠阈值
daemon_status_refresh_interval: 5.0

# ── CORS（测试环境全开放） ───────────────────────────────────────
cors_allowed_origins:
  - "*"

# ── Agent 默认配置（load_agent 时注入） ──────────────────────────
agent_defaults:
  llm:
    # api_key: "${AF_LLM_API_KEY:-e2e-test-key}"
    # base_url: "${AF_LLM_BASE_URL:-}"
    # model: "${AF_LLM_MODEL:-e2e-scripted}"
    api_key: "${AF_LLM_API_KEY:-sk-cp-nbU8hW2JOt8hpWAA32Y8BXP_jnz_H8IoN8jfWoDLaaN_Xf5pz05Yl_Q6oQWJf17-2sE6wcvdtpgbqkx6u-bdodmEfAdj6P_IcZVpOGKFygfJ5RLh_xkWjAY}"
    base_url: "${AF_LLM_BASE_URL:-https://api.minimaxi.com/v1}"
    model: "${AF_LLM_MODEL:-MiniMax-M3}"    
    temperature: 0.7
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    top_k: 0
    stop: ""
  llm_fallback:
    api_key: "e2e-test-key"
    base_url: ""
    model: "e2e-scripted"
  coordinator:
    max_iterations: 5       # 测试缩短轮次
    max_completion_tokens: 1024
    model: ""
    temperature: 0.3
  skill:
    # e2e 优化：真实 LLM (MiniMax-M3) 多轮 tool_calls 长尾延迟显著
    # （实测 outfit-stylist 单节点 150s，含 1 次 83s 长尾 LLM 调用，见
    # logs/tests/20260718_231428_TestRestSseChat_outfit_daemon_real_llm/daemon.log）。
    # 测试场景只需 LLM 给一段 text 回复，无需完整"查天气→识别图→生成效果图"工作流。
    # 限制 max_iterations=2：1 轮 tool_call + 1 轮 finish 足够覆盖 e2e 断言。
    # node_timeout_sec=90：给单轮 LLM 长尾留余量，避免误杀正常调用。
    # llm_recovery_attempts=0：测试不希望进入恢复重试循环。
    # 生产配置 (configs/prod/bridge.yaml) 保留 max_iterations=8 不变。
    max_iterations: 2       # e2e 优化：限制 LLM 循环轮次
    max_completion_tokens: 1024
    llm_recovery_attempts: 0  # e2e 优化：禁用恢复重试
    node_timeout_sec: 90    # e2e 优化：给长尾 LLM 留余量
    model_max_tokens: 32000 # 测试减小上下文
    compaction_threshold: 0.8
    model: ""               # 空=使用全局 AF_LLM_MODEL
    temperature: 0.5
  llm_timeout: 30           # 测试短超时
  llm_connect_timeout: 5
  llm_max_retries: 1
  llm_retry_base_delay: 0.5
  # UDS 通道切换：true 时为模型名自动补 aisf/ 前缀，走 UDS 而非 HTTP
  use_aisf_models: false
  vision:
    base_url: "${AF_VISION_BASE_URL:-}"
    model: "${AF_VISION_MODEL:-}"
    api_key: "${AF_VISION_API_KEY:-}"
  vision_fallback:
    base_url: "${AF_VISION_FALLBACK_BASE_URL:-}"
    model: "${AF_VISION_FALLBACK_MODEL:-}"
    api_key: "${AF_VISION_FALLBACK_API_KEY:-}"
