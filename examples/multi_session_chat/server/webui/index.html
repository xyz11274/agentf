<!doctype html>
<html>
<head><meta charset="utf-8"><title>AgentFlow Chat Example</title></head>
<body>
  <h3>AgentFlow WebSocket Chat</h3>
  <input id="sid" value="webui:default" />
  <input id="text" placeholder="input" size="60" />
  <button onclick="sendMsg()">Send</button>
  <pre id="out"></pre>
<script>
const ws = new WebSocket('ws://' + location.hostname + ':8765');
const out = document.getElementById('out');
ws.onmessage = (e)=>{ out.textContent += e.data + "\n"; };
function sendMsg(){
  ws.send(JSON.stringify({session_id:document.getElementById('sid').value,text:document.getElementById('text').value,workflow_id:'default-dispatcher-workflow'}));
}
</script>
</body></html>
