<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AgentFlow Chat Example</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; }
    #chat { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 420px; overflow-y: auto; background: #fafafa; }
    .row { display: flex; margin: 8px 0; }
    .user { justify-content: flex-end; }
    .assistant { justify-content: flex-start; }
    .bubble { max-width: 75%; padding: 10px; border-radius: 10px; white-space: pre-wrap; }
    .user .bubble { background: #dff1ff; }
    .assistant .bubble { background: #ececec; }
    .meta { font-size: 12px; color: #666; margin-top: 4px; }
    #bar { margin-top: 10px; display: flex; gap: 8px; }
    #text { flex: 1; }
  </style>
</head>
<body>
  <h3>AgentFlow Multi-turn Chat</h3>
  <div style="margin-bottom:8px;">
    Session:
    <input id="sid" value="webui:default" />
    <button id="newSession">New Session</button>
    <button id="clearSession">Clear Current Session</button>
    <button id="reload">Query History</button>
  </div>
  <div id="chat"></div>
  <div id="bar">
    <input id="text" placeholder="输入消息..." />
    <button id="send">Send</button>
  </div>
  <div class="meta" id="status"></div>
<script>
const chat = document.getElementById('chat');
const sidEl = document.getElementById('sid');
const textEl = document.getElementById('text');
const statusEl = document.getElementById('status');

function append(role, text, sessionId) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'assistant');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  statusEl.textContent = `session=${sessionId}`;
  chat.scrollTop = chat.scrollHeight;
}

async function loadHistory() {
  chat.innerHTML = '';
  const sid = sidEl.value || 'webui:default';
  const r = await fetch(`/api/history?session_id=${encodeURIComponent(sid)}&limit=80`);
  const items = await r.json();
  for (const item of items) {
    append(item.role || 'assistant', item.content || item.text || '', sid);
  }
}

function newSession() {
  sidEl.value = `webui:${Date.now()}`;
  chat.innerHTML = '';
  statusEl.textContent = `session=${sidEl.value}`;
}

async function clearSession() {
  const sid = sidEl.value || 'webui:default';
  await fetch(`/api/history?session_id=${encodeURIComponent(sid)}`, { method: 'DELETE' });
  chat.innerHTML = '';
  statusEl.textContent = `session=${sid} (cleared)`;
}

async function sendMsg() {
  const sid = sidEl.value || 'webui:default';
  const text = textEl.value.trim();
  if (!text) return;
  textEl.value = '';
  append('user', text, sid);
  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sid, text, workflow_id: 'default-dispatcher-workflow'})
  });
  const data = await resp.json();
  append('assistant', data.text || '[empty]', sid);
}

document.getElementById('send').onclick = sendMsg;
document.getElementById('reload').onclick = loadHistory;
document.getElementById('newSession').onclick = newSession;
document.getElementById('clearSession').onclick = clearSession;
textEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
loadHistory();
</script>
</body>
</html>
