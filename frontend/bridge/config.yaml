# AgentFlow Bridge — 统一配置
#
# 所有 runtime 配置集中在此文件。修改配置后重启 bridge 生效。
# 环境变量可覆盖此文件中的值（优先级: 环境变量 > config.yaml > 代码默认值）。
#
# 字段说明见 inline 注释，无需看代码即可了解所有可配项。

# ── Daemon（agentflowd）连接 ──────────────────────────────────────
daemon:
  host: "127.0.0.1"        # agentflowd 监听地址
  port: 17891              # agentflowd 监听端口

# ── Bridge 服务绑定 ───────────────────────────────────────────────
bridge:
  listen: "0.0.0.0:8199"       # Bridge 监听地址（可用 BRIDGE_LISTEN 覆盖）

# ── Sidecar（对外入口，仅生产环境） ────────────────────────────────
sidecar:
  enabled: false           # 生产环境设为 true
  listen: "0.0.0.0:23767"  # 对外暴露的地址端口
  aisf_adapter_url: "http://127.0.0.1:18080"  # 内部 aisf_adapter 地址

# ── AISF Adapter（已接入主 Bridge） ─────────────────────────────────
# 对外接收端点：POST /health/v1/tasks（由 routes/aisf_tasks.py 提供）
# 上游 SysAgent 通过此端点下发 TaskAssignment 请求
aisf_adapter:
  agent_id: "outfit-assistant"   # agentflowd 中的 agent 标识
  mode: "async"                   # async | sync（默认异步，符合 AISF 协议）
  timeout: 360.0                  # 单次任务超时（秒）

  # 上游 SysAgent 回调地址（任务完成后 Bridge 主动 POST 回传结果）
  # URL: {scheme}://{Header.SysAgentEntity}:{port}{path}
  upstream:
    scheme: "http"   # http | https
    callback_port: 23767
    callback_path: "/coremind/systemagent/v1/callback"

    # --- TLS / mTLS 证书（仅 scheme=https 时生效） ---
    # 客户端证书（mTLS），留空则不发送客户端证书
    client_cert_path: ""       # PEM 格式客户端证书路径
    client_key_path: ""        # PEM 格式客户端私钥路径
    client_key_password: ""    # 私钥密码（如果加密）
    # 服务端证书验证
    ca_cert_path: ""           # 自定义 CA 证书路径，空=使用系统 CA
    verify: true               # false=跳过服务端证书验证（仅测试/自签名用）

# ── Artifact 公网地址 ─────────────────────────────────────────────
# 空字符串 = 使用相对路径（仅内网可用）
# 线上部署时填公网可访问的 URL，如 https://agent.example.com
# artifact_public_base_url: "https://115.120.249.45:40092/health"
artifact_public_base_url: "http://localhost:8199/health"

# ── 产物输出模式（两维正交开关，详见 docs/design/features/artifact-output-pipeline.md §3.6）──
# artifact_reference: link（默认，Markdown 链接）| placeholder（{{artifact:N}} 占位符，由消费端自行替换）
# artifact_payload:    url（默认，HTTP serve 地址）| base64（内容以 base64 内嵌，无需网络访问 serve URL）
#   组合：link+url 现状；link+base64 文本内 data URI；placeholder+base64 占位符 + 元数据 data_base64
artifact_reference: "link"
artifact_payload: "url"

# ── 产物存储目录（详见 docs/design/features/sandbox/artifact-storage.md §8）──
# 空字符串 = 默认 agent_packages_path.parent / artifacts_storage
artifacts_storage_dir: ""

# ── 图片压缩开关（读取/返回 base64 时压缩,不污染存储原图）──
# 默认启用:读取时等比压缩到最长边 512px + JPEG quality 80(详见 artifact-storage.md §2.4)。
# 置 false 时返回 raw base64 不压缩(对应 env AF_BR_ARTIFACT_COMPRESS_ENABLED)。
artifact_compress_enabled: true

# ── 文件路径 ──────────────────────────────────────────────────────
# 相对路径基于项目根目录解析
agent_packages_dir: "examples/agent"
skill_hub_dir: "resource/skill_hub"
agent_template_dir: "templates"

# ── 日志与超时 ────────────────────────────────────────────────────
log_level: "INFO"
request_timeout_seconds: 15.0    # daemon RPC 超时（临时调大，排查 agent.load 超时问题）
upload_max_body_size_mb: 100     # 上传 body 上限（同步 main.py 的 max_request_body_size）

# ── 会话持久化（Bridge session） ──────────────────────────────────
# Bridge 维护自己的会话/消息/trace 表，独立于 agentflow daemon 的瞬时 session
# 详见 docs/design/features/bridge-session-persistence.md
session_provider: "local"        # local | kmm（Phase 3，暂未实现）
session_db_path: "data/sessions.db"  # LocalSessionProvider SQLite 文件路径
session_context_limit_rounds: 5  # 注入到下一轮 chat 的历史对话轮数
session_sync_interval: 30.0      # agentflow→Bridge session 状态同步轮询间隔（秒）

# ── 多模态内容（Phase A） ─────────────────────────────────────────
# 图片由 content_serializer 全量落盘到 workspace/upload/（不做阈值判断）
uploads_dir: "/tmp/agentflow/uploads"  # 大图落盘目录
chat_turn_timeout_seconds: 900.0  # 聊天单轮总超时（秒，可用 CHAT_TURN_TIMEOUT_SECONDS 覆盖）
daemon_status_refresh_interval: 10.0

# ── 沙箱管理（本地开发可观测性，见 docs/design/features/sandbox-management.md）──
sandbox:
  mode: "local"                  # e2b | local | docker（对齐 daemon sandbox.mode）
  # 注：workdir_root/snapshot_root/daemon_log_path 已废弃——local/docker 模式
  # 切换为 daemon RPC 数据源（sandbox.list），不再目录扫描/日志解析（2026-08-02 重构）
  e2b_api_url: "http://218.245.96.148:30030"
  e2b_api_key: "e2b_000000000"
  e2b_ca_cert_path: "resource/certs/e2b_CA.pem"
  # 注：无 daemon_log_path——local/docker 模式已切换为 daemon RPC 数据源
  # （sandbox.list），不再解析 daemon 日志（2026-08-02 重构）

# ── CORS ──────────────────────────────────────────────────────────
cors_allowed_origins:
  - "http://localhost:15173"
  - "http://127.0.0.1:15173"

# ── Agent 默认配置（load_agent 时自动注入到 .env） ──────────────
# 当 load_agent 发现 agent 的 .env 中缺少以下配置项时，
# 自动按此处的值写入。用户已在 .env 中手动设置的值不会被覆盖。
agent_defaults:
  # ── LLM 主模型 ──
  llm:
    api_key: "${AF_LLM_API_KEY:-sk-ws-H.EDDMREP.gXlt.MEUCIQDS2ezv7sywxvCIry01hm7tkwKSBd0wmaLDz1_cNFgEbAIgK6mwFXsRvqREZbuPPzB1V8C9H3INslUdKhKfDqlV7ig}"
    base_url: "${AF_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    model: "${AF_LLM_MODEL:-deepseek-v4-flash}"

  # ── LLM 降级模型（主模型不可用时自动尝试） ──
  llm_fallback:
    api_key: "sk-ws-H.EDDMREP.gXlt.MEUCIQDS2ezv7sywxvCIry01hm7tkwKSBd0wmaLDz1_cNFgEbAIgK6mwFXsRvqREZbuPPzB1V8C9H3INslUdKhKfDqlV7ig"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "deepseek-v4-flash"

  # ── Coordinator 循环 ──
  coordinator:
    max_iterations: 10
    max_completion_tokens: 8192

  # ── Skill 执行器 ──
  skill:
    max_iterations: 8
    max_completion_tokens: 8192
    llm_recovery_attempts: 2
    node_timeout_sec: 240

  # ── Token 预算与压缩 ──
    model_max_tokens: 128000
    compaction_threshold: 0.8

  # ── LLM 请求调优 ──
  llm_timeout: 120
  llm_connect_timeout: 15
  llm_max_retries: 2
  llm_retry_base_delay: 1.0
  # UDS 通道切换：true 时为模型名自动补 aisf/ 前缀，走 UDS 而非 HTTP
  use_aisf_models: false
  vision:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-vl-max"
    api_key: "sk-ws-H.EDDMREP.gXlt.MEUCIQDS2ezv7sywxvCIry01hm7tkwKSBd0wmaLDz1_cNFgEbAIgK6mwFXsRvqREZbuPPzB1V8C9H3INslUdKhKfDqlV7ig"

  # ── VL 降级模型 ──
  vision_fallback:
    base_url: ""
    model: ""
    api_key: ""
