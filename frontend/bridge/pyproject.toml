[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-bridge"
version = "0.1.0"
description = "FastAPI bridge service between the AgentFlow Vue frontend and the agentflowd daemon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentFlow Maintainers" },
]
keywords = ["agentflow", "bridge", "fastapi", "websocket", "json-rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # HTTP / WebSocket server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    # Outbound HTTP client (used by T4 / T6 for daemon fallback paths if any)
    "httpx>=0.27",
    # Settings + serialization
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.scripts]
agentflow-bridge = "bridge.main:run"

[tool.setuptools]
package-dir = { "bridge" = "frontend/bridge" }

[tool.setuptools.packages.find]
include = ["bridge*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests requiring live daemon + bridge (deselect with -m 'not e2e')",
    "slow: tests that take >10s (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
