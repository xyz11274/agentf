[project]
name = "agentflow-runtime"
version = "0.1.0"
description = "AgentFlow Agent Runtime — generic agent execution engine"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "e2b-code-interpreter==2.8.1",
    "mcp>=1.27,<2",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_sandbox: tests requiring live e2b sandbox (E2B_API_KEY + AF_SANDBOX_ENDPOINT) — skip locally, run on CI with credentials",
]
