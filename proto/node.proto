syntax = "proto3";

package agentflow;

import "agentflow.proto";

// Node execution request
message NodeExecuteRequest {
  string node_id = 1;
  string workflow_execution_id = 2;
  DataMap inputs = 3;
  NodeDefinition node_definition = 4;
}

// Node execution response
message NodeExecuteResponse {
  string node_id = 1;
  StatusCode status = 2;
  DataMap outputs = 3;
  string error_message = 4;
  int32 execution_time_ms = 5;
}

// Node status update
message NodeStatusUpdate {
  string node_id = 1;
  string workflow_execution_id = 2;
  NodeState state = 3;
  string error_message = 4;
  int32 retry_count = 5;
}

// Node metrics
message NodeMetrics {
  string node_id = 1;
  int64 execution_count = 2;
  int64 success_count = 3;
  int64 failure_count = 4;
  int64 total_execution_time_ms = 5;
  int64 avg_execution_time_ms = 6;
  int64 max_execution_time_ms = 7;
  int64 min_execution_time_ms = 8;
}
