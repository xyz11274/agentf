syntax = "proto3";

package agentflow;

import "agentflow.proto";

// Node definition
message NodeDefinition {
  string id = 1;
  string name = 2;
  string type = 3;
  int32 priority = 4;

  // Input/Output interface
  repeated string input_params = 5;
  repeated string output_params = 6;

  // Execution configuration
  ExecutionMode execution_mode = 7;
  string command = 8;
  string working_dir = 9;

  // Error handling
  int32 max_retries = 10;
  int32 timeout_ms = 11;
  int32 retry_delay_ms = 12;

  // Resource limits
  int32 memory_limit_mb = 13;
  int32 cpu_limit = 14;

  // Metadata
  map<string, string> metadata = 15;
}

// Edge definition
message EdgeDefinition {
  string id = 1;
  string source_node_id = 2;
  string target_node_id = 3;

  // Condition expression
  string condition_expression = 4;

  // Data transfer configuration
  repeated string data_formats = 5;
  string data_mapping = 6;

  // Metadata
  map<string, string> metadata = 7;
}

// Workflow definition
message WorkflowDefinition {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;

  // DSL file path
  string dsl_file = 5;

  // Nodes and edges
  repeated NodeDefinition nodes = 6;
  repeated EdgeDefinition edges = 7;

  // Configuration
  int32 timeout_ms = 8;
  map<string, string> metadata = 9;
}

// Workflow execution request
message WorkflowExecuteRequest {
  string workflow_id = 1;
  DataMap inputs = 2;
  map<string, string> options = 3;
}

// Workflow execution response
message WorkflowExecuteResponse {
  string execution_id = 1;
  StatusCode status = 2;
  string message = 3;
}

// Workflow status request
message WorkflowStatusRequest {
  string execution_id = 1;
}

// Workflow status response
message WorkflowStatusResponse {
  string execution_id = 1;
  WorkflowState state = 2;
  DataMap outputs = 3;
  string error_message = 4;
  int32 completed_nodes = 5;
  int32 total_nodes = 6;
}
