apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentflow.fullname" . }}-config
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
data:
  server.yaml: |
    server:
      grpc:
        host: "0.0.0.0"
        port: {{ .Values.service.grpc.port }}
      rest:
        host: "0.0.0.0"
        port: {{ .Values.service.rest.port }}
      websocket:
        enabled: true
        port: {{ .Values.service.websocket.port }}

    runtime:
      worker_threads: {{ .Values.config.workerThreads }}
      max_concurrent_workflows: {{ .Values.config.maxConcurrentWorkflows }}
      default_workflow_timeout_ms: {{ .Values.config.defaultWorkflowTimeoutMs }}
      default_node_timeout_ms: {{ .Values.config.defaultNodeTimeoutMs }}

    storage:
      type: "{{ .Values.storage.type }}"
      rocksdb:
        data_dir: "/app/data/rocksdb"

    metrics:
      enabled: true
      port: {{ .Values.service.metrics.port }}
      path: "/metrics"

    logging:
      level: "INFO"
      format: "json"
      output: "stdout"
