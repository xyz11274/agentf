[package]
name = "trajectory-evolution-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Framework-neutral asynchronous L0-L3 trajectory evolution client"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
