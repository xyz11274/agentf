<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="title desc">
<title id="title">组件架构：主链与后台分离</title><desc id="desc">宿主拥有业务执行，进化组件拥有可观测状态、学习和受控建议。 两种入口复用学习算法，分别由宿主进程与常驻服务维护状态。</desc>
