<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="805" viewBox="0 0 1100 805" role="img" aria-labelledby="title desc">
<title id="title">独立安装包的交付边界</title><desc id="desc">缩进表示归属；右侧解释每个对象承担的责任。 凭据与业务数据不进入安装包；部署配置使用自己的受保护副本。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="805" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">独立安装包的交付边界</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">缩进表示归属；右侧解释每个对象承担的责任。</tspan></text>
