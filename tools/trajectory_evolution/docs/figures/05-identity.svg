<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="741" viewBox="0 0 1100 741" role="img" aria-labelledby="title desc">
<title id="title">身份层次与横向因果</title><desc id="desc">缩进表示归属；右侧解释每个对象承担的责任。 user_id 标识用户，actor_id 标识执行者，scope 划分策略分区。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="741" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">身份层次与横向因果</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">缩进表示归属；右侧解释每个对象承担的责任。</tspan></text>
<rect x="32" y="140" width="1036" height="48" rx="12" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="52" y="171" font-size="20" font-weight="600" fill="#ffffff" data-max-width="458"><tspan x="52" dy="0">对象 / 目录</tspan></text>
<text x="540" y="171" font-size="20" font-weight="600" fill="#ffffff" data-max-width="490"><tspan x="540" dy="0">归属与职责</tspan></text>
<rect x="52" y="202" width="470" height="52" rx="9" fill="#edf4fb" stroke="#285f96" stroke-width="1.5"/>
<text x="64" y="231" font-size="19" font-weight="600" fill="#285f96" data-max-width="446"><tspan x="64" dy="0">application_id</tspan></text>
<text x="540" y="231" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">共享与权限边界</tspan></text>
<path d="M62 256L62 292" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M62 292L76 292" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="76" y="266" width="446" height="52" rx="9" fill="#edf7f1" stroke="#18755f" stroke-width="1.5"/>
<text x="88" y="295" font-size="19" font-weight="600" fill="#18755f" data-max-width="422"><tspan x="88" dy="0">user_id</tspan></text>
<text x="540" y="295" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">认证主体；私库隔离</tspan></text>
<path d="M86 320L86 356" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M86 356L100 356" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="100" y="330" width="422" height="52" rx="9" fill="#f4effa" stroke="#7750a3" stroke-width="1.5"/>
<text x="112" y="359" font-size="19" font-weight="600" fill="#7750a3" data-max-width="398"><tspan x="112" dy="0">conversation_id</tspan></text>
<text x="540" y="359" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">会话分组，多次输入复用</tspan></text>
<path d="M110 384L110 420" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M110 420L124 420" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="124" y="394" width="398" height="52" rx="9" fill="#fff4e8" stroke="#a65e19" stroke-width="1.5"/>
<text x="136" y="423" font-size="19" font-weight="600" fill="#a65e19" data-max-width="374"><tspan x="136" dy="0">run_id</tspan></text>
<text x="540" y="423" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">一次任务从输入到最终终态</tspan></text>
<path d="M134 448L134 484" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M134 484L148 484" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="148" y="458" width="374" height="52" rx="9" fill="#edf4fb" stroke="#285f96" stroke-width="1.5"/>
<text x="160" y="487" font-size="19" font-weight="600" fill="#285f96" data-max-width="350"><tspan x="160" dy="0">activity_id / control_id</tspan></text>
<text x="540" y="487" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">独立活动或控制决定</tspan></text>
<path d="M134 512L134 548" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M134 548L148 548" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="148" y="522" width="374" height="52" rx="9" fill="#edf4fb" stroke="#285f96" stroke-width="1.5"/>
<text x="160" y="551" font-size="19" font-weight="600" fill="#285f96" data-max-width="350"><tspan x="160" dy="0">event_id + caused_by</tspan></text>
<text x="540" y="551" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">跨活动依赖；不按返回顺序猜</tspan></text>
<path d="M110 576L110 612" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<path d="M110 612L124 612" fill="none" stroke="#b1c0ce" stroke-width="1.5"/>
<rect x="124" y="586" width="398" height="52" rx="9" fill="#fff4e8" stroke="#a65e19" stroke-width="1.5"/>
<text x="136" y="615" font-size="19" font-weight="600" fill="#a65e19" data-max-width="374"><tspan x="136" dy="0">另一个 run_id</tspan></text>
<text x="540" y="615" font-size="19" font-weight="400" fill="#203248" data-max-width="490"><tspan x="540" dy="0">新任务，独立状态与策略快照</tspan></text>
<rect x="32" y="662" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="690" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">user_id 标识用户，actor_id 标识执行者，scope 划分策略分区。</tspan></text>
</svg>
