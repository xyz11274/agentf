<text x="40" y="205" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">进程 P1 / 实例 X</tspan></text>
<rect x="239" y="174" width="574" height="66" rx="11" fill="#edf4fb" stroke="#285f96" stroke-width="1.5"/>
<text x="251" y="204" font-size="18" font-weight="600" fill="#285f96" data-max-width="550"><tspan x="251" dy="0">对象仍存活</tspan></text>
<rect x="819" y="174" width="226" height="66" rx="11" fill="#fff4e8" stroke="#a65e19" stroke-width="1.5"/>
<text x="831" y="204" font-size="18" font-weight="600" fill="#a65e19" data-max-width="202"><tspan x="831" dy="0">退出，线程终止</tspan></text>
<text x="40" y="293" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">run R</tspan></text>
<rect x="355" y="262" width="458" height="66" rx="11" fill="#edf7f1" stroke="#18755f" stroke-width="1.5"/>
<text x="367" y="292" font-size="18" font-weight="600" fill="#18755f" data-max-width="434"><tspan x="367" dy="0">函数返回后可继续回调</tspan></text>
<text x="40" y="381" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">显式 close</tspan></text>
<rect x="819" y="350" width="226" height="66" rx="11" fill="#f4effa" stroke="#7750a3" stroke-width="1.5"/>
<text x="831" y="380" font-size="18" font-weight="600" fill="#7750a3" data-max-width="202"><tspan x="831" dy="0">未完成 → 不完整 / 隔离</tspan></text>
<text x="40" y="469" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">进程 P2 / 实例 Y</tspan></text>
<rect x="819" y="438" width="226" height="66" rx="11" fill="#fff4e8" stroke="#a65e19" stroke-width="1.5"/>
<text x="831" y="468" font-size="18" font-weight="600" fill="#a65e19" data-max-width="202"><tspan x="831" dy="0">旧 R：run_not_local</tspan></text>
<rect x="32" y="526" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="554" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">开始快照标记任务，终态发布完整记录；异常退出保留已落盘内容。</tspan></text>
</svg>
