<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc">
<title id="title">函数返回与进程退出是两种事件</title><desc id="desc">从左向右是时间；不同泳道代表不同对象。 开始快照标记任务，终态发布完整记录；异常退出保留已落盘内容。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="605" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">函数返回与进程退出是两种事件</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">从左向右是时间；不同泳道代表不同对象。</tspan></text>
<text x="236" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T0</text>
<text x="352" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T1</text>
