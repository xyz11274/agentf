<path d="M700 162L700 526" fill="none" stroke="#cbd6df" stroke-width="1.5" stroke-dasharray="4 6"/>
<path d="M816 162L816 526" fill="none" stroke="#cbd6df" stroke-width="1.5" stroke-dasharray="4 6"/>
<path d="M932 162L932 526" fill="none" stroke="#cbd6df" stroke-width="1.5" stroke-dasharray="4 6"/>
