<text x="584" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T3</text>
<text x="700" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T4</text>
<text x="816" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T5</text>
<text x="932" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T6</text>
<text x="1048" y="152" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">T7</text>
