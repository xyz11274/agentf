<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="901" viewBox="0 0 1100 901" role="img" aria-labelledby="title desc">
<title id="title">HTTP 请求：状态先提交，再回复</title><desc id="desc">纵向是发生顺序；状态与连接、进程的生命周期分开。 HTTP 有通信与持久化成本；模型评测不在业务响应链路里。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="901" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">HTTP 请求：状态先提交，再回复</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">纵向是发生顺序；状态与连接、进程的生命周期分开。</tspan></text>
<rect x="55" y="140" width="210" height="46" rx="12" fill="#edf4fb" stroke="#285f96" stroke-width="1.5"/>
<text x="160" y="170" text-anchor="middle" font-size="19" fill="#285f96" font-weight="600">客户端</text>
<path d="M160 189L160 806" fill="none" stroke="#becbd7" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="328.3333333333333" y="140" width="210" height="46" rx="12" fill="#f4effa" stroke="#7750a3" stroke-width="1.5"/>
<text x="433.3333333333333" y="170" text-anchor="middle" font-size="19" fill="#7750a3" font-weight="600">常驻服务</text>
<path d="M433.3333333333333 189L433.3333333333333 806" fill="none" stroke="#becbd7" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="601.6666666666666" y="140" width="210" height="46" rx="12" fill="#edf7f1" stroke="#18755f" stroke-width="1.5"/>
<text x="706.6666666666666" y="170" text-anchor="middle" font-size="19" fill="#18755f" font-weight="600">状态文件</text>
<path d="M706.6666666666666 189L706.6666666666666 806" fill="none" stroke="#becbd7" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="875" y="140" width="210" height="46" rx="12" fill="#fff4e8" stroke="#a65e19" stroke-width="1.5"/>
<text x="980" y="170" text-anchor="middle" font-size="19" fill="#a65e19" font-weight="600">后台模型</text>
<path d="M980 189L980 806" fill="none" stroke="#becbd7" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="25" y="290" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">1</text>
<path d="M160 284L433.3333333333333 284" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="163.99999999999997" y="217" width="265.3333333333333" height="59" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="169.99999999999997" y="239" font-size="18" font-weight="500" fill="#203248" data-max-width="253.33333333333331"><tspan x="169.99999999999997" dy="0">POST /v1/invoke +</tspan><tspan x="169.99999999999997" dy="26">request_id</tspan></text>
<text x="25" y="370" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">2</text>
<rect x="324.3333333333333" y="323" width="218" height="59" rx="9" fill="#f4effa" stroke="#7750a3" stroke-width="1.5"/>
<text x="336.3333333333333" y="346" font-size="18" font-weight="600" fill="#7750a3" data-max-width="194"><tspan x="336.3333333333333" dy="0">认证 / 幂等 / 边界校验</tspan></text>
<text x="25" y="450" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">3</text>
<path d="M433.3333333333333 444L706.6666666666666 444" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="437.33333333333337" y="403" width="265.3333333333333" height="33" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="443.33333333333337" y="425" font-size="18" font-weight="500" fill="#203248" data-max-width="253.33333333333331"><tspan x="443.33333333333337" dy="0">原子保存 run 状态</tspan></text>
<text x="25" y="530" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">4</text>
<path d="M433.3333333333333 524L160 524" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="163.99999999999997" y="483" width="265.3333333333333" height="33" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="169.99999999999997" y="505" font-size="18" font-weight="500" fill="#203248" data-max-width="253.33333333333331"><tspan x="169.99999999999997" dy="0">返回结果，连接可关闭</tspan></text>
<text x="25" y="610" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">5</text>
<path d="M160 604L433.3333333333333 604" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="163.99999999999997" y="563" width="265.3333333333333" height="33" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="169.99999999999997" y="585" font-size="18" font-weight="500" fill="#203248" data-max-width="253.33333333333331"><tspan x="169.99999999999997" dy="0">另一进程携同 run_id 上报</tspan></text>
<text x="25" y="690" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">6</text>
<path d="M433.3333333333333 684L706.6666666666666 684" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="437.33333333333337" y="643" width="265.3333333333333" height="33" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="443.33333333333337" y="665" font-size="18" font-weight="500" fill="#203248" data-max-width="253.33333333333331"><tspan x="443.33333333333337" dy="0">run.end 后保存终态</tspan></text>
<text x="25" y="770" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">7</text>
<path d="M433.3333333333333 764L980 764" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="437.33333333333326" y="723" width="538.6666666666667" height="33" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="443.33333333333326" y="745" font-size="18" font-weight="500" fill="#203248" data-max-width="526.6666666666667"><tspan x="443.33333333333326" dy="0">后台按调度条件处理</tspan></text>
<rect x="32" y="822" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="850" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">HTTP 有通信与持久化成本；模型评测不在业务响应链路里。</tspan></text>
</svg>
