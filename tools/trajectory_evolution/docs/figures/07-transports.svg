<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="569" viewBox="0 0 1100 569" role="img" aria-labelledby="title desc">
<title id="title">相同 JSON，不同生命周期</title><desc id="desc">各行列出对应对象、处理方式与适用条件。 根据任务所有者的生命周期选择入口。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="569" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">相同 JSON，不同生命周期</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">各行列出对应对象、处理方式与适用条件。</tspan></text>
<rect x="40" y="140" width="1020" height="53" rx="10" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="54" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="54" dy="0">性质</tspan></text>
<text x="394" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="394" dy="0">原生 LocalRuntime</tspan></text>
<text x="734" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="734" dy="0">HTTP 服务</tspan></text>
<rect x="40" y="193" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="224" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">run 所有者</tspan></text>
<text x="394" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">进程内实例</tspan></text>
<path d="M380 201L380 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">独立常驻服务</tspan></text>
<path d="M720 201L720 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="248" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="279" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">主链开销</tspan></text>
<text x="394" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">内存操作，可降级</tspan></text>
<path d="M380 256L380 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">网络 + 状态持久化</tspan></text>
<path d="M720 256L720 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="303" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="334" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">短进程接续</tspan></text>
<text x="394" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">由原实例持有活跃任务</tspan></text>
<path d="M380 311L380 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">正确上下文可续写</tspan></text>
<path d="M720 311L720 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="358" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="389" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">退出后持久性</tspan></text>
<text x="394" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">仅保留已成功发布的内容</tspan></text>
<path d="M380 366L380 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">成功提交状态可恢复</tspan></text>
<path d="M720 366L720 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="413" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="444" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">管理接口</tspan></text>
<text x="394" y="444" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">不承载磁盘状态管理</tspan></text>
<path d="M380 421L380 460" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="444" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">提供 memory.status 等</tspan></text>
<path d="M720 421L720 460" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="32" y="490" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="518" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">根据任务所有者的生命周期选择入口。</tspan></text>
</svg>
