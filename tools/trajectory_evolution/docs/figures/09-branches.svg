<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="795" viewBox="0 0 1100 795" role="img" aria-labelledby="title desc">
<title id="title">并行归因：三种结果分别处理</title><desc id="desc">乱序终结不改变分支身份，未知与已知失败不同。 待办检查跟踪已登记活动；跨进程作业使用已有任务与调用 ID。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="795" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">并行归因：三种结果分别处理</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">乱序终结不改变分支身份，未知与已知失败不同。</tspan></text>
<rect x="32" y="140" width="1036" height="165" rx="16" fill="#edf4fb" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="171" font-size="21" font-weight="700" fill="#285f96" data-max-width="988"><tspan x="52" dy="0">共同父任务 R</tspan></text>
<rect x="52" y="188" width="996" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="52" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="960"><tspan x="70" dy="0">派发登记</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="960"><tspan x="70" dy="0">A / B / C 各自已有调用 ID；先登记再入队</tspan></text>
<rect x="32" y="323" width="1036" height="192" rx="16" fill="#edf7f1" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="354" font-size="21" font-weight="700" fill="#18755f" data-max-width="988"><tspan x="52" dy="0">独立分支</tspan></text>
<rect x="52" y="371" width="320" height="126" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="52" y="385" width="4" height="98" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="70" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="70" dy="0">A completed</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="70" dy="0">真实结果可合流</tspan></text>
<rect x="390" y="371" width="320" height="126" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="390" y="385" width="4" height="98" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="408" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="408" dy="0">B failed</tspan></text>
<text x="408" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="408" dy="0">业务失败但结果已知</tspan></text>
<rect x="728" y="371" width="320" height="126" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="728" y="385" width="4" height="98" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="746" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="746" dy="0">C unknown</tspan></text>
<text x="746" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="746" dy="0">执行结果待确认，标记完整性缺</tspan><tspan x="746" dy="27">口</tspan></text>
<rect x="32" y="533" width="1036" height="165" rx="16" fill="#fff4e8" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="564" font-size="21" font-weight="700" fill="#a65e19" data-max-width="988"><tspan x="52" dy="0">汇总责任</tspan></text>
<rect x="52" y="581" width="489" height="99" rx="12" fill="#ffffff" stroke="#a65e19" stroke-width="1.5"/>
<rect x="52" y="595" width="4" height="71" rx="2" fill="#a65e19" stroke="none" stroke-width="1.5"/>
<text x="70" y="611" font-size="21" font-weight="700" fill="#a65e19" data-max-width="453"><tspan x="70" dy="0">已知业务部分完成</tspan></text>
<text x="70" y="641" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">按业务规则汇总，不强制全局失败</tspan></text>
<rect x="559" y="581" width="489" height="99" rx="12" fill="#ffffff" stroke="#a65e19" stroke-width="1.5"/>
<rect x="559" y="595" width="4" height="71" rx="2" fill="#a65e19" stroke="none" stroke-width="1.5"/>
<text x="577" y="611" font-size="21" font-weight="700" fill="#a65e19" data-max-width="453"><tspan x="577" dy="0">存在未知执行</tspan></text>
<text x="577" y="641" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">如实标记不完整，不假造完整成功</tspan></text>
<rect x="32" y="716" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="744" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">待办检查跟踪已登记活动；跨进程作业使用已有任务与调用 ID。</tspan></text>
</svg>
