<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="title desc">
<title id="title">Hybrid Evaluator：规则与模型职责</title><desc id="desc">模型补充语义，不覆盖确定性完整性门禁。 评测模型状态、业务结果和候选支持分别记录。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="768" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">Hybrid Evaluator：规则与模型职责</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">模型补充语义，不覆盖确定性完整性门禁。</tspan></text>
<rect x="32" y="140" width="1036" height="165" rx="16" fill="#edf4fb" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="171" font-size="21" font-weight="700" fill="#285f96" data-max-width="988"><tspan x="52" dy="0">共同输入</tspan></text>
<rect x="52" y="188" width="996" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="52" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="960"><tspan x="70" dy="0">有效轨迹 / Episode</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="960"><tspan x="70" dy="0">来源、实际内容、指纹与上下文</tspan></text>
<rect x="32" y="323" width="1036" height="165" rx="16" fill="#edf7f1" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="354" font-size="21" font-weight="700" fill="#18755f" data-max-width="988"><tspan x="52" dy="0">不同判定来源</tspan></text>
<rect x="52" y="371" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="52" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="70" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="70" dy="0">确定性分析</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">重复、重试、状态进展等可核验信号</tspan></text>
<rect x="559" y="371" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="559" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="577" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="577" dy="0">模型评测</tspan></text>
<text x="577" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">脱敏限长正文；判语义和根因</tspan></text>
<rect x="32" y="506" width="1036" height="165" rx="16" fill="#f4effa" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="537" font-size="21" font-weight="700" fill="#7750a3" data-max-width="988"><tspan x="52" dy="0">合并与产物</tspan></text>
<rect x="52" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="52" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="70" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="70" dy="0">响应校验</tspan></text>
<text x="70" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">JSON、引用、范围、置信度</tspan></text>
<rect x="559" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="559" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="577" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="577" dy="0">Evaluation</tspan></text>
<text x="577" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">保留规则与模型状态，供候选生成</tspan></text>
<rect x="32" y="689" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="717" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">评测模型状态、业务结果和候选支持分别记录。</tspan></text>
</svg>
