<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="514" viewBox="0 0 1100 514" role="img" aria-labelledby="title desc">
<title id="title">支持、反证与未知</title><desc id="desc">各行列出对应对象、处理方式与适用条件。 按独立证据统计支持，按任务对照评估收益。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="514" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">支持、反证与未知</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">各行列出对应对象、处理方式与适用条件。</tspan></text>
<rect x="40" y="140" width="1020" height="53" rx="10" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="54" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="482"><tspan x="54" dy="0">观测</tspan></text>
<text x="564" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="482"><tspan x="564" dy="0">对候选的作用</tspan></text>
<rect x="40" y="193" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="224" font-size="19" font-weight="600" fill="#285f96" data-max-width="482"><tspan x="54" dy="0">新独立同类问题</tspan></text>
<text x="564" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="482"><tspan x="564" dy="0">增加真实支持</tspan></text>
<path d="M550 201L550 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="248" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="279" font-size="19" font-weight="600" fill="#285f96" data-max-width="482"><tspan x="54" dy="0">适用条件下的反向观测</tspan></text>
<text x="564" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="482"><tspan x="564" dy="0">质疑适用范围</tspan></text>
<path d="M550 256L550 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="303" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="334" font-size="19" font-weight="600" fill="#285f96" data-max-width="482"><tspan x="54" dy="0">采集缺口</tspan></text>
<text x="564" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="482"><tspan x="564" dy="0">隔离或保留未知</tspan></text>
<path d="M550 311L550 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="358" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="389" font-size="19" font-weight="600" fill="#285f96" data-max-width="482"><tspan x="54" dy="0">模型语义不确定</tspan></text>
<text x="564" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="482"><tspan x="564" dy="0">保持未判定</tspan></text>
<path d="M550 366L550 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="32" y="435" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="463" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">按独立证据统计支持，按任务对照评估收益。</tspan></text>
</svg>
