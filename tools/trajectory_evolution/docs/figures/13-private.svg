<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="title desc">
<title id="title">私库管理：插入、合并、关系、淘汰</title><desc id="desc">同一用户持续入库，证据和规范 ID 一起管理。 策略编译时检查状态、冲突、所有权与授权。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="768" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">私库管理：插入、合并、关系、淘汰</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">同一用户持续入库，证据和规范 ID 一起管理。</tspan></text>
<rect x="32" y="140" width="1036" height="165" rx="16" fill="#edf4fb" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="171" font-size="21" font-weight="700" fill="#285f96" data-max-width="988"><tspan x="52" dy="0">入库判断</tspan></text>
<rect x="52" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="52" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="70" dy="0">ID / 别名 / 规范内容</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">确定性去重优先</tspan></text>
<rect x="559" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="559" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="577" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="577" dy="0">类型 + scope 短名单</tspan></text>
<text x="577" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">有模型预算才判语义关系</tspan></text>
<rect x="32" y="323" width="1036" height="165" rx="16" fill="#edf7f1" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="354" font-size="21" font-weight="700" fill="#18755f" data-max-width="988"><tspan x="52" dy="0">条目与关系</tspan></text>
<rect x="52" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="52" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="70" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="70" dy="0">duplicate</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="70" dy="0">合并到规范 memory_id</tspan></text>
<rect x="390" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="390" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="408" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="408" dy="0">related / contradicts</tspan></text>
<text x="408" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="408" dy="0">保留条目并建立关系</tspan></text>
<rect x="728" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="728" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="746" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="284"><tspan x="746" dy="0">unresolved</tspan></text>
<text x="746" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="746" dy="0">不猜测合并，保守独立保留</tspan></text>
<rect x="32" y="506" width="1036" height="165" rx="16" fill="#f4effa" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="537" font-size="21" font-weight="700" fill="#7750a3" data-max-width="988"><tspan x="52" dy="0">有界全库管理</tspan></text>
<rect x="52" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="52" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="70" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="70" dy="0">累计新建门槛</tspan></text>
<text x="70" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">默认 20 条触发全库复核</tspan></text>
<rect x="559" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="559" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="577" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="577" dy="0">容量淘汰</tspan></text>
<text x="577" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">状态 / 支持 / 修订；冲突组整体处理</tspan></text>
<rect x="32" y="689" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="717" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">策略编译时检查状态、冲突、所有权与授权。</tspan></text>
</svg>
