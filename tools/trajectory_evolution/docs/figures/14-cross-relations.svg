<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="514" viewBox="0 0 1100 514" role="img" aria-labelledby="title desc">
<title id="title">私有—公共关系：局部使用与全局信任</title><desc id="desc">各行列出对应对象、处理方式与适用条件。 关系绑定双方内容版本，私有经验优先并按资格与授权筛选。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="514" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">私有—公共关系：局部使用与全局信任</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">各行列出对应对象、处理方式与适用条件。</tspan></text>
<rect x="40" y="140" width="1020" height="53" rx="10" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="54" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="54" dy="0">关系</tspan></text>
<text x="394" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="394" dy="0">当前用户</tspan></text>
<text x="734" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="734" dy="0">公共全局</tspan></text>
<rect x="40" y="193" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="224" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">duplicate</tspan></text>
<text x="394" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">私有已授权且入选时仅一份</tspan></text>
<path d="M380 201L380 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">不增加重复用户票</tspan></text>
<path d="M720 201L720 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="248" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="279" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">related / independent</tspan></text>
<text x="394" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">可共同候选，按条件和预算</tspan></text>
<path d="M380 256L380 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">不因此撤销</tspan></text>
<path d="M720 256L720 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="303" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="334" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">conflict</tspan></text>
<text x="394" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">保留仍合格私有</tspan></text>
<path d="M380 311L380 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">所有用户后续公共输入暂停</tspan></text>
<path d="M720 311L720 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="358" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="389" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">未知 / 旧版本 / 失败</tspan></text>
<text x="394" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">暂不合用该公共条目</tspan></text>
<path d="M380 366L380 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">保留全局状态，继续核验关系</tspan></text>
<path d="M720 366L720 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="32" y="435" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="463" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">关系绑定双方内容版本，私有经验优先并按资格与授权筛选。</tspan></text>
</svg>
