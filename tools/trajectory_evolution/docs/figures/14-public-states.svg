<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="926" viewBox="0 0 1100 926" role="img" aria-labelledby="title desc">
<title id="title">公共状态：支持、争议、容量与退出</title>
<desc id="desc">支持充分且无冲突才可发布；任一有效冲突全局暂停；发布名额不足进入候补；各状态可按证据过期或容量规则退休。</desc>
<defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#203248;} .head{font-size:23px;font-weight:700} .body{font-size:19px} .label{font-size:17px;fill:#536477}</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536477"/></marker>
</defs>
<rect width="1100" height="926" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700">公共经验的自动状态转换</text>
<text x="36" y="94" font-size="18" fill="#536477">S = 有效独立支持用户；D = 已确认的当前冲突；每次后台管理重新计算。</text>
<g fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M312 272H418"/>
<path d="M682 272H788"/>
<path d="M920 200V152H550V200"/>
<path d="M440 345V406H180V345"/>
<path d="M505 345V460"/>
<path d="M602 460V345"/>
<path d="M180 345V686" stroke-dasharray="6 5"/>
<path d="M920 345V686" stroke-dasharray="6 5"/>
<path d="M550 605V686" stroke-dasharray="6 5"/>
<path d="M682 316H724V686" stroke-dasharray="6 5"/>
</g>
<rect x="48" y="200" width="264" height="145" rx="16" fill="#edf4fb" stroke="#285f96" stroke-width="2"/>
<text x="68" y="238" class="head">pending_support</text>
<text x="68" y="278" class="body">无争议；支持尚不足</text>
<text x="68" y="316" class="body">不进入公共可用投影</text>
<rect x="418" y="200" width="264" height="145" rx="16" fill="#edf7f1" stroke="#18755f" stroke-width="2"/>
<text x="438" y="238" class="head">published</text>
<text x="438" y="278" class="body">支持充分，且有发布名额</text>
<text x="438" y="316" class="body">继续检查用户关系与授权</text>
<rect x="788" y="200" width="264" height="145" rx="16" fill="#fff4e8" stroke="#a65e19" stroke-width="2"/>
<text x="808" y="238" class="head">disputed</text>
<text x="808" y="278" class="body">D 非空；争议优先于票数</text>
<text x="808" y="316" class="body">全局暂停新公共输入</text>
<rect x="418" y="460" width="264" height="145" rx="16" fill="#f4effa" stroke="#7750a3" stroke-width="2"/>
<text x="438" y="498" class="head">reserve</text>
<text x="438" y="540" class="body">支持充分，但排名未入选</text>
<text x="438" y="578" class="body">仍在工作集，等待名额</text>
<text x="328" y="255" class="label">支持达标</text>
<text x="698" y="255" class="label">确认冲突</text>
<text x="604" y="138" class="label">争议消解，支持仍充分且排名入选</text>
<rect x="213" y="378" width="228" height="26" fill="#ffffff"/>
<text x="225" y="396" class="label">支持不足，且没有争议</text>
<rect x="469" y="382" width="100" height="31" fill="#ffffff"/>
<text x="478" y="404" class="label">名额不足 ↓</text>
<rect x="576" y="419" width="109" height="30" fill="#ffffff"/>
<text x="582" y="440" class="label">↑ 排名恢复</text>
<text x="736" y="588" class="label">过期</text>
<rect x="250" y="632" width="628" height="31" fill="#ffffff"/>
<text x="265" y="655" class="label">虚线：证据过期退出；容量淘汰优先选择非 published 条目</text>
<rect x="48" y="686" width="1004" height="98" rx="16" fill="#f1f4f7" stroke="#536477" stroke-width="2"/>
<text x="70" y="726" class="head">retired · 已移出工作集</text>
<text x="70" y="765" class="body">移除条目与关系，保留有界摘要；相同旧证据不立即复活，新独立证据可重新审核。</text>
<rect x="32" y="818" width="1036" height="79" rx="12" fill="#fff4e8" stroke="#e6c5a4"/>
<text x="52" y="848" font-size="18" fill="#a65e19">发布需满足支持、容量与用户级检查；争议消解后重新核验。</text>
<text x="52" y="876" font-size="18" fill="#a65e19">所有变更经后台处理与视图发布后影响新 run；在途 run 保留原策略。</text>
</svg>
