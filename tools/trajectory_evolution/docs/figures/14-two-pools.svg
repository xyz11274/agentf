<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="title desc">
<title id="title">两级记忆：来源不公开，经验可共享</title><desc id="desc">同一 application 内自动管理；公开的是经过审核的泛化建议。 跨用户不读对方私库；sharing 默认开启，经验自动注入仍需授权。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="768" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">两级记忆：来源不公开，经验可共享</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">同一 application 内自动管理；公开的是经过审核的泛化建议。</tspan></text>
<rect x="32" y="140" width="1036" height="165" rx="16" fill="#edf4fb" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="171" font-size="21" font-weight="700" fill="#285f96" data-max-width="988"><tspan x="52" dy="0">用户私有层</tspan></text>
<rect x="52" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="52" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="70" dy="0">Alice 私库</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">本人证据、历史与偏好</tspan></text>
<rect x="559" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="559" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="577" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="577" dy="0">Bob 私库</tspan></text>
<text x="577" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">独立身份与独立支持</tspan></text>
<rect x="32" y="323" width="1036" height="165" rx="16" fill="#f4effa" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="354" font-size="21" font-weight="700" fill="#7750a3" data-max-width="988"><tspan x="52" dy="0">受限后台管理</tspan></text>
<rect x="52" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="52" y="385" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="70" y="401" font-size="21" font-weight="700" fill="#7750a3" data-max-width="284"><tspan x="70" dy="0">独立证据核验</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="70" dy="0">完整 run；指纹；排除注入回声</tspan></text>
<rect x="390" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="390" y="385" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="408" y="401" font-size="21" font-weight="700" fill="#7750a3" data-max-width="284"><tspan x="408" dy="0">提炼 + 复核</tspan></text>
<text x="408" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="408" dy="0">泛化、隐私、忠实与权限门禁</tspan></text>
<rect x="728" y="371" width="320" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="728" y="385" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="746" y="401" font-size="21" font-weight="700" fill="#7750a3" data-max-width="284"><tspan x="746" dy="0">内部账本</tspan></text>
<text x="746" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="284"><tspan x="746" dy="0">来源、投票、关系、待办与淘汰</tspan></text>
<rect x="32" y="506" width="1036" height="165" rx="16" fill="#edf7f1" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="537" font-size="21" font-weight="700" fill="#18755f" data-max-width="988"><tspan x="52" dy="0">可用经验层</tspan></text>
<rect x="52" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="52" y="568" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="70" y="584" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="70" dy="0">根 memory</tspan></text>
<text x="70" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">仅 published 泛化内容，不含私人来源</tspan></text>
<rect x="559" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="559" y="568" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="577" y="584" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="577" dy="0">当前用户策略</tspan></text>
<text x="577" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">自己的私库 + 安全公共视图</tspan></text>
<rect x="32" y="689" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="717" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">跨用户不读对方私库；sharing 默认开启，经验自动注入仍需授权。</tspan></text>
</svg>
