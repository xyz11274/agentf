<text x="367" y="292" font-size="18" font-weight="600" fill="#285f96" data-max-width="666"><tspan x="367" dy="0">始终使用 P-A</tspan></text>
<text x="40" y="381" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">新 run B</tspan></text>
