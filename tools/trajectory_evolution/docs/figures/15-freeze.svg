<text x="40" y="205" font-size="20" font-weight="600" fill="#203248" data-max-width="176"><tspan x="40" dy="0">后台记忆视图</tspan></text>
<rect x="239" y="174" width="342" height="66" rx="11" fill="#f4effa" stroke="#7750a3" stroke-width="1.5"/>
