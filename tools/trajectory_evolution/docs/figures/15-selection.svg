<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="569" viewBox="0 0 1100 569" role="img" aria-labelledby="title desc">
<title id="title">从两库到一次有界注入</title><desc id="desc">各行列出对应对象、处理方式与适用条件。 运行时在有界快照中检索，再按条件和预算注入经验。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="569" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">从两库到一次有界注入</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">各行列出对应对象、处理方式与适用条件。</tspan></text>
<rect x="40" y="140" width="1020" height="53" rx="10" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="54" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="54" dy="0">阶段</tspan></text>
<text x="394" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="394" dy="0">检查对象</tspan></text>
<text x="734" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="312"><tspan x="734" dy="0">未通过结果</tspan></text>
<rect x="40" y="193" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="224" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">私库资格</tspan></text>
<text x="394" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">归属 / 类型 / 状态 / 反证</tspan></text>
<path d="M380 201L380 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">排除条目</tspan></text>
<path d="M720 201L720 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="248" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="279" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">公共安全</tspan></text>
<text x="394" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">应用 / scope / 版本关系</tspan></text>
<path d="M380 256L380 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">该公共条目不合用</tspan></text>
<path d="M720 256L720 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="303" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="334" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">精确授权</tspan></text>
<text x="394" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">memory_id + content_revision</tspan></text>
<path d="M380 311L380 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">不进入运行检索</tspan></text>
<path d="M720 311L720 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="358" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="389" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">条件匹配</tspan></text>
<text x="394" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">当前任务/状态命中条件词</tspan></text>
<path d="M380 366L380 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">no_match</tspan></text>
<path d="M720 366L720 405" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="413" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="444" font-size="19" font-weight="600" fill="#285f96" data-max-width="312"><tspan x="54" dy="0">排序和预算</tspan></text>
<text x="394" y="444" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="394" dy="0">私有优先、重复只留一份</tspan></text>
<path d="M380 421L380 460" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="734" y="444" font-size="19" font-weight="400" fill="#203248" data-max-width="312"><tspan x="734" dy="0">最多有限条数与字节</tspan></text>
<path d="M720 421L720 460" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="32" y="490" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="518" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">运行时在有界快照中检索，再按条件和预算注入经验。</tspan></text>
</svg>
