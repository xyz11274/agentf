<text x="170" y="239" font-size="18" font-weight="500" fill="#203248" data-max-width="390"><tspan x="170" dy="0">activity.begin：原始 input + binding</tspan></text>
<text x="25" y="344" text-anchor="middle" font-size="17" fill="#536477" font-weight="600">2</text>
<path d="M570 338L160 338" fill="none" stroke="#203248" stroke-width="2.5" marker-end="url(#arrow)"/>
