<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="541" viewBox="0 0 1100 541" role="img" aria-labelledby="title desc">
<title id="title">L2 与 L3 的作用范围</title><desc id="desc">各行列出对应对象、处理方式与适用条件。 动作与循环规则通过部署配置授权，在对应边界执行。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="541" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">L2 与 L3 的作用范围</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">各行列出对应对象、处理方式与适用条件。</tspan></text>
<rect x="40" y="140" width="1020" height="53" rx="10" fill="#203248" stroke="none" stroke-width="1.5"/>
<text x="54" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="227"><tspan x="54" dy="0">控制</tspan></text>
<text x="309" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="227"><tspan x="309" dy="0">绑定对象</tspan></text>
<text x="564" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="227"><tspan x="564" dy="0">决定</tspan></text>
<text x="819" y="170" font-size="20" font-weight="600" fill="#ffffff" data-max-width="227"><tspan x="819" dy="0">宿主责任</tspan></text>
<rect x="40" y="193" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="224" font-size="19" font-weight="600" fill="#285f96" data-max-width="227"><tspan x="54" dy="0">动作规则</tspan></text>
<text x="309" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="309" dy="0">一个 action</tspan></text>
<path d="M295 201L295 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="564" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="564" dy="0">allow / reject</tspan></text>
<path d="M550 201L550 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="819" y="224" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="819" dy="0">逐项执行/不执行并报告</tspan></text>
<path d="M805 201L805 240" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="248" width="1020" height="55" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="279" font-size="19" font-weight="600" fill="#285f96" data-max-width="227"><tspan x="54" dy="0">循环预算</tspan></text>
<text x="309" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="309" dy="0">一个 loop_id</tspan></text>
<path d="M295 256L295 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="564" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="564" dy="0">continue</tspan></text>
<path d="M550 256L550 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="819" y="279" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="819" dy="0">安排真实下一轮</tspan></text>
<path d="M805 256L805 295" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="303" width="1020" height="55" rx="0" fill="#edf4fb" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="334" font-size="19" font-weight="600" fill="#285f96" data-max-width="227"><tspan x="54" dy="0">无进展恢复</tspan></text>
<text x="309" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="309" dy="0">当前 loop</tspan></text>
<path d="M295 311L295 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="564" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="564" dy="0">replan</tspan></text>
<path d="M550 311L550 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="819" y="334" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="819" dy="0">落实有限重规划上下文</tspan></text>
<path d="M805 311L805 350" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="40" y="358" width="1020" height="82" rx="0" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<text x="54" y="389" font-size="19" font-weight="600" fill="#285f96" data-max-width="227"><tspan x="54" dy="0">循环停止</tspan></text>
<text x="309" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="309" dy="0">当前 loop</tspan></text>
<path d="M295 366L295 432" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="564" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="564" dy="0">stop</tspan></text>
<path d="M550 366L550 432" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<text x="819" y="389" font-size="19" font-weight="400" fill="#203248" data-max-width="227"><tspan x="819" dy="0">停止对应循环</tspan></text>
<path d="M805 366L805 432" fill="none" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="32" y="462" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="490" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">动作与循环规则通过部署配置授权，在对应边界执行。</tspan></text>
</svg>
