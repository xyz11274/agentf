<text x="70" y="401" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="70" dy="0">训练 / 验证 / 留出</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">分离优化与最终检验用途</tspan></text>
<rect x="559" y="371" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
