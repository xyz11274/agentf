<text x="577" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">可执行检查 + 必要模型评判</tspan></text>
<rect x="32" y="323" width="1036" height="165" rx="16" fill="#f4effa" stroke="#cad5df" stroke-width="1.5"/>
