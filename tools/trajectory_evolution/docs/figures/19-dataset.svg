<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="70" dy="0">种子任务 / 派生任务</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">明确输入、环境和场景</tspan></text>
<rect x="559" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
