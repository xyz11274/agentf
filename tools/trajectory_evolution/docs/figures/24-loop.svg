<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="title desc">
<title id="title">证据回流：从轨迹到下一次运行</title><desc id="desc">轨迹学习生成经验，后台冻结候选并运行独立 Agent 评测，合格版本供后续 run 使用，实测结果同步回写记忆状态。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#203248"/></marker></defs>
<rect width="1100" height="768" fill="#ffffff"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#203248" data-max-width="1016"><tspan x="36" dy="0">证据回流：从轨迹到下一次运行</tspan></text>
<text x="36" y="94" font-size="18" font-weight="400" fill="#536477" data-max-width="1016"><tspan x="36" dy="0">启用评测准入：后台验证冻结候选，前台使用已发布版本，结果回写记忆。</tspan></text>
<rect x="32" y="140" width="1036" height="165" rx="16" fill="#edf4fb" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="171" font-size="21" font-weight="700" fill="#285f96" data-max-width="988"><tspan x="52" dy="0">记录与学习</tspan></text>
<rect x="52" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="52" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="70" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="70" dy="0">真实轨迹</tspan></text>
<text x="70" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">校验、评测、根因与候选</tspan></text>
<rect x="559" y="188" width="489" height="99" rx="12" fill="#ffffff" stroke="#285f96" stroke-width="1.5"/>
<rect x="559" y="202" width="4" height="71" rx="2" fill="#285f96" stroke="none" stroke-width="1.5"/>
<text x="577" y="218" font-size="21" font-weight="700" fill="#285f96" data-max-width="453"><tspan x="577" dy="0">私有 + 公共管理</tspan></text>
<text x="577" y="248" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">去重、证据、关系和淘汰</tspan></text>
<rect x="32" y="323" width="1036" height="165" rx="16" fill="#edf7f1" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="354" font-size="21" font-weight="700" fill="#18755f" data-max-width="988"><tspan x="52" dy="0">后台评测与发布</tspan></text>
<rect x="52" y="371" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="52" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="70" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="70" dy="0">冻结基线与候选</tspan></text>
<text x="70" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">同一任务集、行为版本、判分标准</tspan></text>
<rect x="559" y="371" width="489" height="99" rx="12" fill="#ffffff" stroke="#18755f" stroke-width="1.5"/>
<rect x="559" y="385" width="4" height="71" rx="2" fill="#18755f" stroke="none" stroke-width="1.5"/>
<text x="577" y="401" font-size="21" font-weight="700" fill="#18755f" data-max-width="453"><tspan x="577" dy="0">独立 Agent 实测</tspan></text>
<text x="577" y="431" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">质量、调用、时延、无效循环准入</tspan></text>
<rect x="32" y="506" width="1036" height="165" rx="16" fill="#f4effa" stroke="#cad5df" stroke-width="1.5"/>
<text x="52" y="537" font-size="21" font-weight="700" fill="#7750a3" data-max-width="988"><tspan x="52" dy="0">前台应用与反馈</tspan></text>
<rect x="52" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="52" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="70" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="70" dy="0">新 run 使用已发布策略</tspan></text>
<text x="70" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="70" dy="0">内存查询、版本固定、回执与新轨迹</tspan></text>
<rect x="559" y="554" width="489" height="99" rx="12" fill="#ffffff" stroke="#7750a3" stroke-width="1.5"/>
<rect x="559" y="568" width="4" height="71" rx="2" fill="#7750a3" stroke="none" stroke-width="1.5"/>
<text x="577" y="584" font-size="21" font-weight="700" fill="#7750a3" data-max-width="453"><tspan x="577" dy="0">记忆实测状态回写</tspan></text>
<text x="577" y="614" font-size="19" font-weight="400" fill="#203248" data-max-width="453"><tspan x="577" dy="0">版本反馈、单条验证、退化归档</tspan></text>
<rect x="32" y="689" width="1036" height="51" rx="12" fill="#fff4e8" stroke="#e6c5a4" stroke-width="1.5"/>
<text x="52" y="717" font-size="18" font-weight="400" fill="#a65e19" data-max-width="984"><tspan x="52" dy="0">前台持续执行，后台按预算评测；新版本只在后续 run 生效，试验数据独立保存。</tspan></text>
</svg>
