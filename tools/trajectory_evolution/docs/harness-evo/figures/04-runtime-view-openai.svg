<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#71717a"/></marker>
    <marker id="aog" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10a37f"/></marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" fill="#0d0d0d" font-size="20" font-weight="600">运行视图：常驻服务、异步任务与自进化闭环</text>
  <rect x="40" y="80" width="240" height="220" rx="8" fill="none" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="52" y="100" fill="#6e6e80" font-size="12" font-weight="500">宿主进程（低延迟主链路）</text>
  <rect x="60" y="112" width="200" height="56" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="160" y="137" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">Agent 宿主</text>
  <text x="160" y="157" text-anchor="middle" fill="#6e6e80" font-size="12.5">8 语言 · 已有业务 ID</text>
  <rect x="60" y="192" width="200" height="56" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="160" y="217" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">原生 LocalRuntime</text>
  <text x="160" y="237" text-anchor="middle" fill="#6e6e80" font-size="12.5">进程内 ABI · 零开销降级</text>
  <rect x="340" y="80" width="580" height="440" rx="8" fill="none" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="352" y="100" fill="#6e6e80" font-size="12" font-weight="500">常驻服务集群（跨进程 run 维护）</text>
  <rect x="360" y="112" width="260" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="360" y="112" width="4" height="60" rx="2" fill="#10a37f"/>
  <text x="490" y="139" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">轨迹采集与评测服务</text>
  <text x="490" y="159" text-anchor="middle" fill="#6e6e80" font-size="12.5">校验 · 评测 · 反思入库</text>
  <rect x="360" y="204" width="260" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="490" y="231" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">学习调度服务</text>
  <text x="490" y="251" text-anchor="middle" fill="#6e6e80" font-size="12.5">队列 · 分批 · 去重 · 预算</text>
  <rect x="360" y="296" width="260" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="360" y="296" width="4" height="60" rx="2" fill="#10a37f"/>
  <text x="490" y="323" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">GEPA 搜索服务</text>
  <text x="490" y="343" text-anchor="middle" fill="#6e6e80" font-size="12.5">多父谱系 · Holdout 准入</text>
  <rect x="360" y="388" width="260" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="360" y="388" width="4" height="60" rx="2" fill="#10a37f"/>
  <text x="490" y="415" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">策略运行时服务</text>
  <text x="490" y="435" text-anchor="middle" fill="#6e6e80" font-size="12.5">L1–L3 控制 · 影子对照</text>
  <rect x="660" y="204" width="240" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="780" y="231" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">消息队列</text>
  <text x="780" y="251" text-anchor="middle" fill="#6e6e80" font-size="12.5">事件解耦 · 异步调度</text>
  <rect x="660" y="296" width="240" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="780" y="323" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">存储与状态恢复</text>
  <text x="780" y="343" text-anchor="middle" fill="#6e6e80" font-size="12.5">持久化 · 故障恢复</text>
  <rect x="660" y="388" width="240" height="60" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="780" y="415" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="600">管控看板服务</text>
  <text x="780" y="435" text-anchor="middle" fill="#6e6e80" font-size="12.5">可视化 · 审计 · 授权</text>
  <line x1="280" y1="142" x2="360" y2="142" stroke="#10a37f" stroke-width="1.5" marker-end="url(#aog)"/>
  <text x="320" y="134" text-anchor="middle" fill="#6e6e80" font-size="12">point 上报（异步）</text>
  <path d="M 620,142 L 640,142 L 640,226 L 660,226" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="628" y="180" fill="#6e6e80" font-size="12">事件</text>
  <line x1="660" y1="234" x2="620" y2="234" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="640" y="226" text-anchor="middle" fill="#6e6e80" font-size="12">任务分发</text>
  <line x1="490" y1="264" x2="490" y2="296" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="490" y="272" text-anchor="middle" fill="#6e6e80" font-size="12">补训 · 预算内</text>
  <line x1="620" y1="326" x2="660" y2="326" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="640" y="318" text-anchor="middle" fill="#6e6e80" font-size="12">状态持久化</text>
  <line x1="660" y1="418" x2="620" y2="418" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="640" y="410" text-anchor="middle" fill="#6e6e80" font-size="12">快照加载</text>
  <line x1="490" y1="356" x2="490" y2="388" stroke="#10a37f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aog)"/>
  <text x="490" y="364" text-anchor="middle" fill="#6e6e80" font-size="12">准入后发布</text>
  <path d="M 360,418 L 300,418 L 300,220 L 280,220" fill="none" stroke="#10a37f" stroke-width="1.5" marker-end="url(#aog)"/>
  <text x="308" y="320" fill="#10a37f" font-size="12" transform="rotate(90 308 320)" text-anchor="middle">策略快照下发</text>
  <rect x="40" y="548" width="880" height="56" rx="8" fill="none" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="572" text-anchor="middle" fill="#0d0d0d" font-size="13.5" font-weight="500">异步任务体系：离线样本生成 · GEPA 搜索 · 模型训练 · 策略效果评估 · 历史复盘</text>
  <text x="480" y="592" text-anchor="middle" fill="#6e6e80" font-size="12">经消息队列解耦，不在宿主主流程内等待；宿主退出时后台线程安全收尾</text>
  <line x1="480" y1="520" x2="480" y2="546" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ao)"/>
  <g transform="translate(44,626)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#10a37f" stroke-width="1.5" marker-end="url(#aog)"/><text x="36" y="12" fill="#6e6e80" font-size="12">主链路 / 生效流</text>
    <line x1="160" y1="8" x2="188" y2="8" stroke="#71717a" stroke-width="1.5" marker-end="url(#ao)"/><text x="196" y="12" fill="#6e6e80" font-size="12">常规调用</text>
    <line x1="272" y1="8" x2="300" y2="8" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ao)"/><text x="308" y="12" fill="#6e6e80" font-size="12">异步 / 受控发布</text>
  </g>
</svg>