syntax = "proto3";
package trajectory.evolution.v1;

import "shadow_policy.proto";
import "trajectory_trace.proto";
import "google/protobuf/struct.proto";

// Explicit authorization, not automatic promotion of candidate memories.
message ExperienceApproval {
  string memory_id = 1;
  string content_revision = 2;
}
// A version-local rewrite; the source memory and its eligibility stay unchanged.
message ExperienceOverride {
  ExperienceApproval source_experience = 1;
  string content = 2;
  // Empty preserves the source condition; the approved memory stays immutable.
  string trigger_pattern = 3;
  // Optional any-of guard over executed actions in the current observation batch.
  // A mention or proposed tool call is not an observation.
  repeated string observed_operations = 4;
}
message ActionRule {
  string rule_id = 1;
  string target_scope = 2;
  string operation = 3;
  bool deny = 4;
  repeated string required_arguments = 5;
  string reason = 6;
  // Provenance and authorization are independent of L1 retrieval limits.
  ExperienceApproval source_experience = 7;
  // predicate: match the executable condition in this scope. Empty retains
  // legacy experience-retrieval gating for previously exported policies.
  string match_mode = 8;
  // Reject a new operation only after this many settled failures in the run.
  uint32 max_failed_attempts = 9;
  // Stable scalar arguments identifying one target within this run. Empty
  // retains execution-local retry counting used by existing policy bundles.
  repeated string failure_key_arguments = 10;
}
// L2 orchestration is separate from action validation. Only actions already
// present in a host batch may be ordered; host dependencies are never removed.
message ScheduleRule {
  string rule_id = 1;
  string target_scope = 2;
  string before_operation = 3;
  // Equal operation names serialize distinct instances in original batch order.
  string after_operation = 4;
  bool require_success = 5; // false: wait for completion, including failure
  string reason = 6;
  ExperienceApproval source_experience = 7;
  // Optional local task guard. Empty retains existing exported policy behavior.
  repeated string task_terms = 8; // all must occur in the current run task
  repeated string exclude_terms = 9; // none may occur in the current run task
}
message ActionDependency {
  string action_id = 1;
  bool require_success = 2;
  string rule_id = 3; // empty for an original host dependency
}
message ScheduledAction {
  string action_id = 1;
  repeated ActionDependency after = 2;
}
message SchedulePlan {
  string policy_id = 1;
  string execution_id = 2;
  repeated ScheduledAction actions = 3;
  repeated string rule_ids = 4;
  string status = 5; // unchanged | scheduled | conflict (host plan retained)
}
message ScheduledActionState {
  string action_id = 1;
  // waiting | running | succeeded | failed | cancelled | unknown | skipped
  string status = 2;
}
message ScheduleState {
  SchedulePlan plan = 1;
  repeated ScheduledActionState actions = 2;
}
message LoopRule {
  string rule_id = 1;
  string target_scope = 2;
  uint32 max_iterations = 3;
  uint32 max_no_progress = 4;
  // stop | replan; a replan is a bounded, request-only context addition.
  string no_progress_decision = 5;
  uint32 max_replans = 6;
  string replan_context = 7;
  string reason = 8;
  ExperienceApproval source_experience = 9;
  string match_mode = 10; // predicate | empty (legacy experience retrieval)
  // Replan after an observed action failure; never stop solely on this signal.
  bool replan_on_failure = 11;
  // Empty applies to every actor in the scope; otherwise only this actor.
  string actor_id = 12;
}
message RuntimeOptions {
  Level requested_level = 1;
  // Host declarations are checked here; they are NOT runtime probe evidence.
  repeated string host_capabilities = 2;
  string fallback = 3; // strict | downgrade
  repeated string allowed_users = 4;
  repeated string allowed_conversations = 5;
  repeated ExperienceApproval approved_experiences = 6;
  repeated ActionRule action_rules = 7;
  repeated LoopRule loop_rules = 8;
  string experience_template = 9; // exactly one {{experience}} placeholder
  uint32 max_context_bytes = 10;
  // Optional framework-neutral binding. Empty preserves the original messages
  // verification contract. These fields are part of the immutable policy hash.
  string request_context_pointer = 11; // RFC 6901 pointer, e.g. /system
  string request_context_mode = 12; // text | system_message
  repeated ExperienceOverride experience_overrides = 13;
  repeated ScheduleRule schedule_rules = 14;
  // Executable controls bypass legacy L1 retrieval and count repeated failed
  // operations even when their arguments/error text change. Persisted in bundles.
  bool aggressive_controls = 15;
}
message RuntimePolicy {
  uint32 schema_version = 1;
  string policy_id = 2;
  ShadowPolicySnapshot snapshot = 3;
  RuntimeOptions options = 4;
  Level effective_level = 5;
}
message RuntimeAction {
  string action_id = 1;
  string operation = 2;
  google.protobuf.Struct arguments = 3;
  // Derived by the boundary from the current model request. This is runtime
  // schema evidence, not a configured or learned tool allowlist.
  repeated string schema_required_arguments = 4;
  repeated ActionDependency after = 5;
  uint32 prior_failures = 6;
  // Package-observed target failure counts, keyed by the matching rule ID.
  map<string, uint32> target_failures = 7;
}
// The caller persists this per execution instance, never per skill name.
message LoopProgress {
  string execution_id = 1;
  uint64 iteration = 2;
  string fingerprint = 3;
  uint32 no_progress = 4;
  uint32 replans = 5;
  string decision = 6;
  string rule_id = 7;
  string reason = 8;
  string policy_id = 9;
  string target_scope = 10;
}
message RuntimeQuery {
  AdviceQuery advice_query = 1;
  string boundary = 2; // llm | actions | schedule | loop
  string execution_id = 3;
  repeated RuntimeAction actions = 4;
  uint64 iteration = 5;
  string state_fingerprint = 6;
  LoopProgress previous = 7;
  bool pending_actions = 8;
  // Completed failed actions since this execution's previous settled control step.
  uint32 failed_actions = 9;
  // Consecutive settled steps containing only previously observed action
  // input/output pairs in this execution. Complements unchanged-state detection.
  uint32 repeated_action_steps = 10;
  // Repeated failures of an operation since its last success. Populated only
  // for a settled step with failures and no successful action, in aggressive mode.
  uint32 repeated_failure_steps = 11;
  repeated string observed_operations = 12;
  string actor_id = 13;
}
message ActionDecision {
  string action_id = 1;
  string decision = 2; // allow | reject
  string rule_id = 3;
  string reason = 4;
}
message RuntimeDecision {
  string policy_id = 1;
  RuntimeQuery query = 2;
  string status = 3; // ready | no_change
  string context = 4;
  repeated ExperienceApproval experiences = 5;
  repeated ActionDecision actions = 6;
  LoopProgress progress = 7;
  SchedulePlan schedule = 8;
}
message RuntimeObservation {
  // The final serialized request, not the mutable prompt history.
  google.protobuf.Struct request = 1;
  bool transport_allowed = 2;
  string call_id = 3;
  repeated string executed_action_ids = 4;
  repeated string skipped_action_ids = 5;
  string loop_decision = 6;
  // Ordered observations from actual starts/completions, not dispatch ACKs.
  repeated ScheduledActionState schedule_events = 7;
}
message RuntimeReceipt {
  Identity identity = 1;
  Application application = 2;
  string execution_id = 3;
  string boundary = 4;
  string call_id = 5;
  repeated string action_ids = 6;
  repeated ExperienceApproval experiences = 7;
  repeated string rule_ids = 8;
}
message RuntimeCommand {
  string memory_path = 1;
  Identity identity = 2;
  ShadowOptions shadow_options = 3;
  RuntimeOptions options = 4;
  RuntimePolicy policy = 5;
  RuntimeQuery query = 6;
  RuntimeObservation observation = 7;
}
