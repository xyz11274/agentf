// trajectory_trace 持久化协议：字段编号用于跨语言序列化兼容。
// 新增能力优先增加字段，不复用已有编号改变原含义。
// 身份、执行事实、评分和策略版本分别记录；缺失信息不能等同于零或成功。

syntax = "proto3";

package trajectory.evolution.v1;

import "google/protobuf/struct.proto";

// 等级描述组件接入契约，不表示策略已证明有效。
enum Level {
  LEVEL_NONE = 0;
  L0 = 1;
  L1 = 2;
  L2 = 3;
  L3 = 4;
  L4 = 5;
}

enum CheckStatus {
  NOT_VERIFIED = 0;
  PASS = 1;
  FAIL = 2;
  NOT_APPLICABLE = 3;
}

message Identity {
  string run_id = 1;
  string agent_id = 2;
  string user_id = 3;
  string conversation_id = 4;
}

message RunOutcome {
  // 执行状态：completed、failed、cancelled、unknown，与任务业务成功分开。
  string execution_status = 1;
  // 业务结果：succeeded、failed、partial、unknown。
  string business_status = 2;
}

message ErrorInfo {
  string code = 1;
  string message = 2;
  // 可重试性：retryable、non_retryable、unknown。
  string retryability = 3;
}

message Application {
  string query_id = 1;
  string policy_id = 2;
  string policy_revision = 3;
  string decision_id = 4;
  // 应用状态：applied、rejected、failed；注入回执不等于业务遵循证明。
  string status = 5;
  string reason = 6;
  string experiment_id = 7;
  string cohort = 8;
}

message TraceEvent {
  string event_id = 1;
  // 生命周期事件包括运行、步骤和动作的开始/结束，以及循环决定；
  // 还包括建议应用、状态变化、评测和自定义事件。
  string kind = 2;
  string producer_id = 3;
  uint64 sequence = 4;
  uint64 timestamp_us = 5;
  string actor_id = 6;
  string execution_id = 7;
  string step_id = 8;
  string action_id = 9;
  string loop_id = 10;
  uint64 iteration = 11;
  repeated string caused_by = 12;
  string operation = 13;
  // 步骤或动作结束时必须有终态：completed、failed、cancelled、unknown。
  string status = 14;
  google.protobuf.Value input = 15;
  google.protobuf.Value output = 16;
  ErrorInfo error = 17;
  string state_before = 18;
  string state_after = 19;
  // 循环决定：continue、replan、stop。
  string decision = 20;
  string reason = 21;
  RunOutcome outcome = 22;
  Application application = 23;
  google.protobuf.Struct attributes = 24;
}

message TraceRun {
  uint32 schema_version = 1;
  // 必须等于 trajectory.v1，避免误把旧分析 JSON 当成标准轨迹。
  string trace_kind = 2;
  Identity identity = 3;
  repeated TraceEvent events = 4;
  google.protobuf.Struct attributes = 5;
}

message CapabilityManifest {
  uint32 schema_version = 1;
  Level requested_level = 2;
  repeated string declared_capabilities = 3;
  repeated string not_applicable = 4;
  // 接入失败处理：downgrade 表示降级，strict 表示严格拒绝。
  string fallback = 5;
}

message TraceIssue {
  string code = 1;
  // 诊断等级为 error 或 warning；验证输出不复制原始事件正文。
  string severity = 2;
  uint64 event_index = 3;
}

message CapabilityCheck {
  string capability = 1;
  Level required_level = 2;
  bool declared = 3;
  CheckStatus data_status = 4;
  CheckStatus runtime_status = 5;
  repeated string reasons = 6;
}

message CapabilityReport {
  uint32 schema_version = 1;
  string source_format = 2;
  Level requested_level = 3;
  Level data_level = 4;
  Level verified_level = 5;
  Level effective_level = 6;
  Level component_level = 7;
  bool requested_level_satisfied = 8;
  bool trace_valid = 9;
  uint64 event_count = 10;
  uint64 duplicate_event_count = 11;
  repeated CapabilityCheck checks = 12;
  repeated TraceIssue issues = 13;
}
