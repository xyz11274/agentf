---
version: 1.0.0

project:
  name: "SystemTest"
  desc: "SystemTest project"
  prod: null
  team: null

pipeline:
  build:
    - task: "cmake_test"
      args: "--compiler=clang15.0.4"
  run:
    - task: "run_test"
      args: -a"--gtest_output=xml:report.xml"
  report:
    #- task: "gcovr_report"
